services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: retail
      MYSQL_USER: retail
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
